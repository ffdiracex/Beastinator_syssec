[package]
name = "nicwatch"
version = "0.2.0"
edition = "2021"
rust-version = "1.79"
description = "A top-like live network interface monitor for FreeBSD and Linux"
license = "BSD-2-Clause"

[lib]
name = "nicwatch"
path = "src/lib.rs"

[[bin]]
name = "nicwatch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dashmap = "6"
etherparse = "0.15"
futures = "0.3"
humantime = "2"
parking_lot = "0.12"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1.13"
thiserror = "1"
tokio = { version = "1.40", features = [
    "rt-multi-thread", "macros", "sync", "time", "signal", "io-util",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "freebsd")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
